[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pothole-ml"
version = "0.1.0"
description = "Small neural network for pothole / bump detection from phone accelerometer data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pothole_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
