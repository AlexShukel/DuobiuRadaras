<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pothole Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="tabs" role="tablist">
    <button class="tab active" role="tab" data-tab="live" aria-selected="true">Potholes</button>
    <button class="tab" role="tab" data-tab="dataset" aria-selected="false">Training data</button>
  </nav>

  <section class="panel active" id="panel-live" role="tabpanel">
    <div id="map" class="map"></div>
    <div id="status" class="status">Loading potholes…</div>
  </section>

  <section class="panel" id="panel-dataset" role="tabpanel" hidden>
    <div id="dataset-map" class="map"></div>
    <div id="dataset-legend" class="legend" hidden>
      <div class="legend-row"><span class="dot pothole"></span> pothole</div>
      <div class="legend-row"><span class="dot bump"></span> bump</div>
      <div id="dataset-routes"></div>
    </div>
    <div id="dataset-status" class="status">Loading training data…</div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
