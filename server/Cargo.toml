[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
